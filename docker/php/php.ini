; Off, and deliberately: PHP printing a warning commits the response before
; Symfony can send headers. A body past post_max_size is exactly that case —
; the startup warning lands first and the documented 413 turns into a 200
; carrying an HTML error page. Symfony renders errors itself in dev.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL
memory_limit = 512M

opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
