; Off deliberately: a warning printed here commits the response before Symfony
; can send headers, turning the documented 413 past post_max_size into a 200.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /dev/stderr
error_reporting = E_ALL
memory_limit = 512M

opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 0
