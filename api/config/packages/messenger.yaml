framework:
    messenger:
        transports:
            # Conversion jobs are long-running: they never run inside the
            # request/response cycle. See docs/architecture.md.
            conversions:
                dsn: '%env(MESSENGER_TRANSPORT_DSN)%'
                options:
                    queue_name: conversions
                    # How long a worker killed mid-job holds the message.
                    redeliver_timeout: 300
                # No retries: the conversion records its own failure, and a
                # caller polling the status must not be told a job is over
                # while another attempt could still turn it around.
                retry_strategy:
                    max_retries: 0

        routing:
            'App\Message\RunConversion': conversions

when@test:
    framework:
        messenger:
            transports:
                # Held in memory so tests can assert on a *pending* conversion
                # and then drain the queue explicitly. See tests/Api/ApiTestCase.
                conversions: 'in-memory://'
